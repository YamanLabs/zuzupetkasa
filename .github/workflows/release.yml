name: Build & Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build Windows & Create Release
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js + Portable Executables (x64 & ARM64)
        run: npm run dist -- --publish never

      - name: Build ARM64 Unpacked (app.asar icin)
        run: npx electron-builder --dir --arm64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: app-arm64.asar hazirla
        shell: pwsh
        run: |
          $asarSrc  = "dist\win-arm64-unpacked\resources\app.asar"
          $asarDest = "dist\app-arm64.asar"
          Copy-Item -Path $asarSrc -Destination $asarDest -Force
          $sizeMB = [math]::Round((Get-Item $asarDest).Length / 1MB, 1)
          Write-Host "app-arm64.asar hazir: $sizeMB MB"

      - name: GitHub Release olustur ve tum assetleri yukle
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/app-arm64.asar
          name: "Surum ${{ github.ref_name }}"
          body: |
            ## ZUZU PET Kasa POS — ${{ github.ref_name }}
            - Otomatik bulut derlemesi yayinlandi.
            - Performans iyilestirmeleri ve guncellemeler icerir.

            ### Kurulum
            - **Yeni kurulum:** `.exe` dosyasini indirin
            - **Mevcut uygulama guncellemesi:** Uygulamada "Guncelleme Kontrol Et" tuslayın (otomatik indirir)
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
