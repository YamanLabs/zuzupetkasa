name: Build & Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build Windows Executable & Create Release
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js and Portable Executable (x64 & ARM64)
        run: npm run dist -- --publish never

      - name: Create GitHub Release and Upload Exe
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          name: Sürüm ${{ github.ref_name }}
          body: |
            ## ZUZU PET Kasa POS Otomasyonu - Sürüm ${{ github.ref_name }}
            - Otomatik bulut derlemesi yayınlandı.
            - Performans iyileştirmeleri ve güncellemeler içerir.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
